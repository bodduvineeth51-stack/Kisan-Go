<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Kisan Go</title>
  <!-- Green rounded background -->
  <rect width="32" height="32" rx="7" fill="#16a34a"/>
  <!-- Rear wheel (large) -->
  <circle cx="11" cy="22" r="6" stroke="white" stroke-width="2" fill="none"/>
  <circle cx="11" cy="22" r="2" fill="white"/>
  <!-- Rear wheel spokes -->
  <line x1="11" y1="16" x2="11" y2="28" stroke="white" stroke-width="1.2"/>
  <line x1="5" y1="22" x2="17" y2="22" stroke="white" stroke-width="1.2"/>
  <!-- Front wheel (small) -->
  <circle cx="25" cy="24" r="3.5" stroke="white" stroke-width="2" fill="none"/>
  <circle cx="25" cy="24" r="1.2" fill="white"/>
  <!-- Chassis / body beam -->
  <rect x="10" y="18" width="16" height="4.5" rx="1.5" fill="white"/>
  <!-- Cab -->
  <rect x="16" y="11" width="8" height="8" rx="2" fill="white"/>
  <!-- Exhaust pipe -->
  <rect x="21" y="7" width="2" height="6" rx="1" fill="white"/>
</svg>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kisan Go Customers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+Telugu:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#15803D}a:hover{color:#166534}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2FAF4; color: #0F2A1A; font-family: 'Plus Jakarta Sans', 'Noto Sans Telugu', sans-serif; line-height: 1.3; display: flex; flex-direction: column; overflow: hidden; position: relative">
<div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 14px; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<h1 style="margin: 0; font-weight: 800; font-size: 28px; letter-spacing: -0.8px">Customers</h1>
<span style="padding: 5px 12px; border-radius: 12px; background: #DCFCE7; font-size: 13px; font-weight: 800; color: #15803D">124 farmers</span>
</div>

<div style="display: flex; align-items: center; height: 56px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 4px 14px rgba(15,42,26,0.06); padding-left: 16px; gap: 10px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4B6355" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<label for="search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search customers</label>
<input id="search" type="search" placeholder="Search name or phone" style="flex: 1; min-width: 0; border: 0; outline: none; font-family: inherit; font-size: 16px; font-weight: 500; color: #0F2A1A; background: transparent">
<button aria-label="Search by voice" style="width: 46px; height: 46px; margin-right: 5px; border-radius: 14px; border: 0; background: #15803D; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
</div>

<div style="display: flex; gap: 8px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
<button onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="{{f.style}}">{{f.label}}</button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{rows}}" as="c" hint-placeholder-count="6">
<a href="Customer.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 4px 14px rgba(15,42,26,0.06); text-decoration: none; color: #0F2A1A">
<span style="{{c.avatarStyle}}">{{c.initials}}</span>
<span style="flex: 1; min-width: 0"><span style="display: block; font-size: 16px; font-weight: 700">{{c.name}}</span><span style="display: block; font-size: 13px; font-weight: 500; color: #4B6355">{{c.village}} · {{c.phone}}</span></span>
<sc-if value="{{c.isDue}}" hint-placeholder-val="{{ true }}">
<span style="padding: 4px 10px; border-radius: 10px; background: #FFEDD5; font-size: 14px; font-weight: 800; color: #C2410C">{{c.due}}</span>
</sc-if>
<sc-if value="{{c.isPaid}}" hint-placeholder-val="{{ false }}">
<span style="display: flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 10px; background: #DCFCE7; font-size: 13px; font-weight: 800; color: #15803D"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Paid</span>
</sc-if>
</a>
</sc-for>
</div>
</div>

<button aria-label="Add customer" style="position: absolute; right: 20px; bottom: 96px; height: 58px; padding: 0 22px 0 16px; border-radius: 29px; border: 0; background: #15803D; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; box-shadow: 0 12px 26px rgba(21,128,61,0.4)"><span style="width: 32px; height: 32px; border-radius: 50%; background: #BEF264; color: #0F2A1A; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>Add</button>

<nav aria-label="Main" style="flex-shrink: 0; margin: 0 12px 12px; height: 68px; box-sizing: border-box; background: #FFFFFF; border-radius: 24px; box-shadow: 0 6px 24px rgba(15,42,26,0.12); display: flex; gap: 4px; padding: 8px">
<a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; text-decoration: none; color: #4B6355; font-size: 12px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
<a href="Customers.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; background: #DCFCE7; text-decoration: none; color: #15803D; font-size: 12px; font-weight: 800"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.7 3 2.5 3.5 5.2"></path></svg>Customers</a>
<a href="Money.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; text-decoration: none; color: #4B6355; font-size: 12px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"></rect><path d="M3 10h18"></path><circle cx="16.5" cy="14.5" r="1.2"></circle></svg>Money</a>
<a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; text-decoration: none; color: #4B6355; font-size: 12px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>More</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { filter: 'all' };
}
renderVals() {
const tints = [['#BBF7D0', '#166534'], ['#FEF3C7', '#92400E'], ['#E0F2FE', '#075985'], ['#FCE7F3', '#9D174D'], ['#EDE9FE', '#5B21B6']];
const people = [
{ name: 'Ramulu', initials: 'RA', village: 'Kondapur', phone: '98480 12345', due: 6250 },
{ name: 'Venkatesh', initials: 'VE', village: 'Peddapalli', phone: '94401 55678', due: 0 },
{ name: 'Lakshmamma', initials: 'LA', village: 'Kondapur', phone: '99634 21870', due: 4800 },
{ name: 'Narsimha', initials: 'NA', village: 'Ramapuram', phone: '90002 44319', due: 3900 },
{ name: 'Sathyam', initials: 'SA', village: 'Peddapalli', phone: '96520 78013', due: 0 },
{ name: 'Anjaiah', initials: 'AN', village: 'Kondapur', phone: '98854 30927', due: 2500 },
{ name: 'Yadagiri', initials: 'YA', village: 'Ramapuram', phone: '91211 66402', due: 0 }
];
const f = this.state.filter;
const rows = people
.map((p, i) => ({ ...p, tint: tints[i % tints.length] }))
.filter((p) => f === 'all' || (f === 'due' ? p.due > 0 : p.due === 0))
.map((p) => ({
...p,
isDue: p.due > 0,
isPaid: p.due === 0,
due: '₹' + p.due.toLocaleString('en-IN'),
avatarStyle: 'width: 42px; height: 42px; flex-shrink: 0; border-radius: 14px; background: ' + p.tint[0] + '; color: ' + p.tint[1] + '; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center'
}));
const base = 'height: 44px; padding: 0 16px; border-radius: 22px; border: 0; font-family: inherit; font-size: 14px; cursor: pointer; ';
const on = base + 'background: #15803D; color: #FFFFFF; font-weight: 800; box-shadow: 0 6px 14px rgba(21,128,61,0.25)';
const off = base + 'background: #FFFFFF; color: #0F2A1A; font-weight: 600; box-shadow: 0 2px 8px rgba(15,42,26,0.06)';
const defs = [['all', 'All'], ['due', 'Owes money · 17'], ['paid', 'Paid']];
const filters = defs.map(([id, label]) => ({
label: label,
pressed: f === id ? 'true' : 'false',
style: f === id ? on : off,
pick: () => this.setState({ filter: id })
}));
return { rows: rows, filters: filters };
}
}
</script>
</body>
</html>

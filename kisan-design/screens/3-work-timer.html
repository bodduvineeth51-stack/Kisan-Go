<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kisan Go Work Timer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+Telugu:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#15803D}a:hover{color:#166534}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2FAF4; color: #0F2A1A; font-family: 'Plus Jakarta Sans', 'Noto Sans Telugu', sans-serif; line-height: 1.3; display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 20px; overflow: hidden">

<div style="display: flex; align-items: center; gap: 12px; height: 44px">
<a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 2px 10px rgba(15,42,26,0.08); display: flex; align-items: center; justify-content: center; color: #0F2A1A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; font-weight: 800; font-size: 22px; letter-spacing: -0.5px">Work in progress</h1>
<span style="margin-left: auto; display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 12px; background: {{badgeBg}}; color: {{badgeFg}}; font-size: 12px; font-weight: 800"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{badgeFg}}"></span>{{badgeText}}</span>
</div>

<div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: #FFFFFF; border-radius: 20px; box-shadow: 0 4px 14px rgba(15,42,26,0.06)">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: #BBF7D0; color: #166534; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center">RA</span>
<span style="flex: 1; min-width: 0"><span style="display: block; font-size: 17px; font-weight: 800">Ramulu</span><span style="display: block; font-size: 13px; font-weight: 500; color: #4B6355">Kondapur · 98480 12345</span></span>
<a href="Customers.dc.html" style="font-size: 14px; font-weight: 700; padding: 10px 12px; border-radius: 12px; background: #F0FDF4; text-decoration: none">Change</a>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button aria-pressed="true" style="height: 56px; border-radius: 18px; border: 2px solid #16A34A; background: #DCFCE7; font-family: inherit; color: #15803D; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2"><span style="font-size: 16px; font-weight: 800">Harvester</span><span style="font-size: 12px; font-weight: 700">₹2,500 / hour</span></button>
<button style="height: 56px; border-radius: 18px; border: 2px solid #E2EDE5; background: #FFFFFF; font-family: inherit; color: #0F2A1A; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2"><span style="font-size: 16px; font-weight: 700">Tractor</span><span style="font-size: 12px; font-weight: 500; color: #4B6355">₹900 / hour</span></button>
</div>

<div style="position: relative; width: 204px; height: 204px; align-self: center">
<svg width="204" height="204" viewBox="0 0 204 204" aria-hidden="true" style="position: absolute; inset: 0">
<circle cx="102" cy="102" r="88" fill="#FFFFFF" stroke="#DCFCE7" stroke-width="14"></circle>
<circle cx="102" cy="102" r="88" fill="none" stroke="{{ringColor}}" stroke-width="14" stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="{{offset}}" transform="rotate(-90 102 102)"></circle>
</svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span style="font-size: 13px; font-weight: 700; color: #4B6355">{{statusText}}</span>
<span style="font-weight: 800; font-size: 38px; letter-spacing: -1px; font-variant-numeric: tabular-nums; line-height: 1.15">{{clock}}</span>
</div>
</div>

<sc-if value="{{running}}" hint-placeholder-val="{{ true }}">
<button onClick="{{toggle}}" style="height: 72px; flex-shrink: 0; border-radius: 24px; border: 0; background: #DC2626; color: #FFFFFF; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 14px; box-shadow: 0 10px 22px rgba(220,38,38,0.3); cursor: pointer">
<span style="width: 26px; height: 26px; border-radius: 7px; background: #FFFFFF"></span>
<span style="font-weight: 800; font-size: 24px">Stop</span><span style="font-size: 16px; font-weight: 600; opacity: 0.9">· ఆపండి</span>
</button>
</sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{ false }}">
<button onClick="{{toggle}}" style="height: 72px; flex-shrink: 0; border-radius: 24px; border: 0; background: #0F2A1A; color: #FFFFFF; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 14px; box-shadow: 0 10px 22px rgba(15,42,26,0.25); cursor: pointer">
<span style="width: 40px; height: 40px; border-radius: 50%; background: #BEF264; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="#0F2A1A"></path></svg></span>
<span style="font-weight: 800; font-size: 22px">Start again</span>
</button>
</sc-if>

<div style="background: #FFFFFF; border-radius: 22px; box-shadow: 0 4px 14px rgba(15,42,26,0.06); overflow: hidden">
<div style="display: flex; justify-content: space-between; padding: 9px 16px; font-size: 15px; border-bottom: 1px solid #EEF5F0"><span style="color: #4B6355; font-weight: 500">1 · 12:00 – 12:30</span><span style="font-weight: 700">30 min</span></div>
<div style="display: flex; justify-content: space-between; padding: 9px 16px; font-size: 15px; border-bottom: 1px solid #EEF5F0"><span style="color: #4B6355; font-weight: 500">2 · 1:00 – 1:30</span><span style="font-weight: 700">30 min</span></div>
<div style="display: flex; justify-content: space-between; padding: 9px 16px; font-size: 15px"><span style="color: #4B6355; font-weight: 500">3 · 2:10 – {{endLabel}}</span><span style="font-weight: 700">{{currentMins}} min</span></div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #15803D; color: #FFFFFF">
<span><span style="display: block; font-size: 12px; font-weight: 600; color: #DCFCE7">Total time</span><span style="display: block; font-size: 19px; font-weight: 800">{{totalText}}</span></span>
<span style="text-align: right"><span style="display: block; font-size: 12px; font-weight: 600; color: #DCFCE7">Bill so far</span><span style="display: block; font-size: 24px; font-weight: 800; letter-spacing: -0.5px">{{amountText}}</span></span>
</div>
</div>

<div style="margin-top: auto; display: flex; gap: 10px">
<button style="height: 58px; padding: 0 16px; border-radius: 18px; border: 0; background: #FFFFFF; box-shadow: 0 4px 14px rgba(15,42,26,0.06); font-family: inherit; font-size: 15px; font-weight: 700; color: #15803D; display: flex; align-items: center; gap: 6px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add time</button>
<a href="BillSent.dc.html" style="flex: 1; height: 58px; border-radius: 18px; background: #15803D; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 800; box-shadow: 0 10px 22px rgba(21,128,61,0.3)">Finish &amp; send bill</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { secs: 1457, running: true };
}
componentDidMount() {
this.timer = setInterval(() => {
if (this.state.running) this.setState({ secs: this.state.secs + 1 });
}, 1000);
}
componentWillUnmount() {
clearInterval(this.timer);
}
renderVals() {
const s = this.state.secs;
const pad = (n) => String(n).padStart(2, '0');
const clock = pad(Math.floor(s / 3600)) + ':' + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60);
const totalMin = 60 + Math.floor(s / 60);
const totalText = Math.floor(totalMin / 60) + 'h ' + pad(totalMin % 60) + 'm';
const amount = Math.round(((3600 + s) / 3600) * 2500);
const running = this.state.running;
const C = 553;
return {
clock: clock,
running: running,
paused: !running,
offset: Math.round(C * (1 - (s % 3600) / 3600)),
ringColor: running ? '#16A34A' : '#9CA3AF',
badgeBg: running ? '#FEE2E2' : '#F3F4F6',
badgeFg: running ? '#B91C1C' : '#4B5563',
badgeText: running ? 'LIVE' : 'PAUSED',
statusText: running ? 'Session 3' : 'Paused',
endLabel: running ? 'now' : 'stopped',
currentMins: Math.floor(s / 60),
totalText: totalText,
amountText: '₹' + amount.toLocaleString('en-IN'),
toggle: () => this.setState({ running: !this.state.running })
};
}
}
</script>
</body>
</html>
